<!DOCTYPE html>
<html lang="en-CA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Rainscope Filmworks</title>
    <meta name="description" content="The page you're looking for doesn't exist. Return to Rainscope Filmworks homepage.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://rainscopefilmworks.com/404.html">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
    
    <link rel="stylesheet" href="assets/css/styles.css?v=20">
    
    <style>
        .error-page {
            margin-top: var(--header-height);
            min-height: calc(100vh - var(--header-height));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(2rem, 4vw, 4rem);
            background: #173633;
            color: white;
            text-align: center;
        }
        
        .error-content {
            max-width: 600px;
        }
        
        .error-code {
            font-size: clamp(4rem, 10vw, 8rem);
            font-weight: 700;
            margin-bottom: 1rem;
            color: white;
        }
        
        .error-title {
            font-size: clamp(1.5rem, 3vw, 2.5rem);
            font-weight: 600;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .error-message {
            font-size: clamp(1rem, 1.5vw, 1.2rem);
            margin-bottom: 2rem;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
        }
        
        .error-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    {% include "header.njk" %}

    <!-- Error Content -->
    <main id="main-content" class="error-page">
        <div class="error-content">
            <h1 class="error-code">404</h1>
            <h2 class="error-title">Page Not Found</h2>
            <p class="error-message">
                The page you're looking for doesn't exist or has been moved. 
                Let's get you back on track.
            </p>
            <div class="error-actions">
                <a href="index.html" class="btn-primary btn-primary-filled">Go Home</a>
                <a href="contact.html" class="btn-primary">Contact Us</a>
            </div>
        </div>
    </main>
    {% include "footer.njk" %}

    <script src="assets/js/script.js"></script>
</body>
</html>
